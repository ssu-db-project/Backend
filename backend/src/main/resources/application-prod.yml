# application-prod.yml
# 💡 [필수] prod 프로파일 활성화
spring:
  #profiles:
    #active: prod

  # 💡 [필수] H2 대신 MySQL/RDS 접속 설정으로 덮어쓰기
  datasource:
    # 💡 EC2 서버 내부에서 Docker 컨테이너의 3306 포트로 접속 (localhost 사용)
    url: jdbc:mysql://localhost:3306/db_project?serverTimezone=UTC&characterEncoding=UTF-8
    username: root          # <-- 원하는 사용자명
    password: ssudb02251203   # <-- 직접 설정할 비밀번호
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 💡 [선택/권장] JPA 설정 (운영 환경에서는 ddl-auto는 update 또는 none)
  jpa:
    hibernate:
      ddl-auto: update # 초기 배포 후에는 'none'으로 변경하여 실수 방지
    properties:
      hibernate:
        show_sql: true
        format_sql: true

# 💡 [AI 설정 유지] LangChain 및 OpenAI 설정은 그대로 기본값을 사용합니다.
#    (이 부분은 application.yml에서 상속받으므로, 굳이 복붙하지 않아도 됩니다.)
#    하지만 안전을 위해, 아래 두 블록은 추가하는 것을 추천합니다.

openai:
  api-key: ${OPENAI_API_KEY}
  model: "gpt-4o-mini"
  temperature: 0.7

langchain:
  chroma:
    base-url: http://localhost:8000
    collection-name: univ_embeddings