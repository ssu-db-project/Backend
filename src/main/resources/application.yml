server:
  port: 8080

spring:
  application:
    name: demo-langchain
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        show_sql: true
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace

# OpenAI API 설정
openai:
  api-key: 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
  model: "gpt-4o-mini"
  temperature: 0.7

# LangChain 설정 (Chroma DB 경로)
langchain:
  chroma:
    base-url: http://localhost:8000
    collection-name: univ_embeddings

management:
  endpoints:
    web:
      exposure:
        include: health,info
